[package]
name = "abyss"
version = "0.1.0"
description = "Abyss — launcher for Phineas' desktop apps"
authors = ["Phineas"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "abyss_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Windows toast when an update is found while Abyss sits in the tray.
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Same TLS stack as tauri-plugin-updater (rustls + ring), so it compiles once.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
sha2 = "0.11"
minisign-verify = "0.3"
base64 = "0.22"
semver = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
