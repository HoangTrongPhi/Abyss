<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="deep" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#11141b"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#deep)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2a3140" stroke-width="8"/>
  <!-- Rings sinking into the abyss: each smaller and lower than the last. -->
  <g fill="none" stroke="url(#ring)" stroke-linecap="round">
    <ellipse cx="256" cy="200" rx="176" ry="64" stroke-width="22"/>
    <ellipse cx="256" cy="262" rx="122" ry="44" stroke-width="20" opacity="0.8"/>
    <ellipse cx="256" cy="314" rx="74" ry="27" stroke-width="18" opacity="0.6"/>
    <ellipse cx="256" cy="354" rx="34" ry="12" stroke-width="16" opacity="0.45"/>
  </g>
  <circle cx="256" cy="392" r="14" fill="#5eead4"/>
</svg>
