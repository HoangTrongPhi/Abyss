[package]
name = "__APP_ID__"
version = "0.1.0"
description = "__APP_NAME__ — __TAGLINE__"
authors = ["Phineas"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "__APP_CRATE___lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
